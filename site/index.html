<style>
/* Layout: carte marine — un graphe de questions ouvertes sur une mer d'encre, fiche de lecture à côté */
:root{
  --bg:#0d1a26; --bg2:#13263a; --line:#2a425b; --fg:#e6edf2; --muted:#8fa6b8; --accent:#f2b45a;
  --d-P:#7fb8ff; --d-V:#6fd3a0; --d-E:#e58fd6; --d-M:#f2b45a; --d-I:#b6a3ff; --d-T:#5fd0d6; --d-H:#ff9478;
  --f-display:"IM Fell English SC", Georgia, serif;
  --f-body:"Inter", system-ui, "Noto Sans", "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef2f4; --bg2:#ffffff; --line:#c6d2da; --fg:#13212d; --muted:#5a6f7f; --accent:#b06d0b;
  --d-P:#2a6fc9; --d-V:#1f8a57; --d-E:#a23d92; --d-M:#b06d0b; --d-I:#6a52d1; --d-T:#14868c; --d-H:#c9472a;
  color-scheme:light } }
:root[data-theme="light"]{
  --bg:#eef2f4; --bg2:#ffffff; --line:#c6d2da; --fg:#13212d; --muted:#5a6f7f; --accent:#b06d0b;
  --d-P:#2a6fc9; --d-V:#1f8a57; --d-E:#a23d92; --d-M:#b06d0b; --d-I:#6a52d1; --d-T:#14868c; --d-H:#c9472a;
  color-scheme:light }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);margin:0;line-height:1;letter-spacing:.02em}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
select{font:500 13px var(--f-body);background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:500 12.5px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.42}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#q{font:14px var(--f-body);background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;flex:1 1 180px;max-width:280px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.sea{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--line) 70%,transparent) 1px, transparent 0) 0 0/22px 22px, var(--bg)}
canvas{display:block;width:100%;height:clamp(420px,70vh,760px);cursor:grab;touch-action:none}
.status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;pointer-events:none}
.legend{position:absolute;inset-inline-start:12px;bottom:10px;font:11px var(--f-body);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted)}
.legend b.d1{border-style:dashed}.legend b.d0{border-style:dotted}
aside{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.dom{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
aside h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.nonlatin aside h2{font-family:var(--f-body);font-weight:600;font-size:22px}
.near{align-self:flex-start;font:500 12px var(--f-body);padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--fg)}
.near[data-n="2"]{border-color:var(--accent);color:var(--accent)}
.fallback{font-size:12px;color:var(--muted);border-inline-start:2px solid var(--accent);padding-inline-start:8px;margin:0}
section h3{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
section p{margin:0}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{font:13px var(--f-body);text-align:start;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 9px;cursor:pointer}
.links button:hover{border-color:var(--accent)}
footer{color:var(--muted);font-size:12.5px}
.srcs{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.srcs a{color:var(--accent);overflow-wrap:anywhere}
.srcs a:hover{text-decoration:underline}
.srcty{display:inline-block;margin-inline-start:6px;font:500 10.5px var(--f-body);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;vertical-align:1px;white-space:nowrap}
.srcty.strong{color:var(--accent);border-color:var(--accent)}
.extra{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.extra{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.nonlatin .card h2{font-family:var(--f-body);font-weight:600;font-size:20px}
#newsList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
#newsList time{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#newsList ul{margin:4px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
#newsList button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-align:start}
#newsList button:hover{text-decoration:underline}
#propForm{display:flex;flex-direction:column;gap:6px}
#propForm label{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
#propForm textarea,#propForm input{font:14px var(--f-body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
#propForm button{align-self:flex-start;margin-top:8px;font:600 14px var(--f-body);background:var(--accent);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
#pMsg{margin:0;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
.sublist{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rev{margin:0;font-size:13px}.rev.none{color:var(--muted)}
#digest{grid-column:1/-1}
.digest-body p{margin:0 0 10px;max-width:72ch}
.digest-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.months{display:flex;flex-wrap:wrap;gap:6px}
.months button{font:12px var(--f-mono);background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}
.months button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#nlForm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
#nlForm label{font-size:14px;flex:1 1 100%}
#nlForm input{font:14px var(--f-body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex:1 1 220px;min-width:0}
#nlForm button{font:600 14px var(--f-body);background:var(--accent);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
#nlMsg{margin:0;font-size:13px;color:var(--muted);flex:1 1 100%}
#propForm select{font:14px var(--f-body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Terra Incognita</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="right">
      <select id="lang" aria-label="Language"></select>
      <div class="count" id="count">—</div>
    </div>
  </header>
  <div class="tools" id="filters"></div>
  <div class="main">
    <div class="sea">
      <canvas id="cv" role="img"></canvas>
      <div class="status" id="status"></div>
      <div class="legend" id="legend"></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
  <div class="extra">
    <section class="card" id="digest" aria-labelledby="digT">
      <div class="digest-head"><h2 id="digT"></h2><div class="months" id="months"></div></div>
      <div class="digest-body" id="digBody"></div>
      <form name="newsletter" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="nlForm" hidden>
        <input type="hidden" name="form-name" value="newsletter">
        <p hidden><label>Leave empty <input name="bot-field"></label></p>
        <label for="nlE" id="nlL"></label>
        <input id="nlE" name="email" type="email" required maxlength="200" autocomplete="email">
        <input type="hidden" name="lang" id="nlLang" value="en">
        <button type="submit" id="nlBtn"></button><p id="nlMsg" role="status"></p>
      </form>
    </section>
    <section class="card" id="news" aria-labelledby="newsT"><h2 id="newsT"></h2><ol id="newsList"></ol></section>
    <section class="card" id="propose" aria-labelledby="propT" hidden><h2 id="propT"></h2>
      <form name="propose" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="propForm">
        <input type="hidden" name="form-name" value="propose">
        <p hidden><label>Leave empty <input name="bot-field"></label></p>
        <label for="pk" id="pkL"></label><select id="pk" name="kind"><option value="question" id="pk0"></option><option value="correction" id="pk1"></option><option value="reviewer" id="pk2"></option></select>
        <label for="pq" id="pqL"></label><textarea id="pq" name="message" rows="4" required maxlength="3000"></textarea>
        <label for="ps" id="psL"></label><input id="ps" name="source" type="url" maxlength="500">
        <label for="pe" id="peL"></label><input id="pe" name="email" type="email" maxlength="200">
        <button type="submit" id="pBtn"></button><p id="pMsg" role="status"></p>
      </form>
    </section>
  </div>
  <footer><span id="foot"></span> <a id="dataLink" href="data.json" hidden></a></footer>
</div>

const DKEYS=["P","V","E","M","I","T","H"];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),statusEl=$('status'),panel=$('panel');
let nodes=[],byId={},edges=[],sel=null,hover=null,query='',statusKey='loading';
const active=new Set(DKEYS);
let view={x:0,y:0,k:1},W=0,H=0,dpr=1;

function pickLang(){
  try{const s=localStorage.getItem('ti-lang');if(UI[s])return s}catch(e){}
  for(const l of navigator.languages||[navigator.language||'en']){const b=(l||'').slice(0,2).toLowerCase();if(UI[b])return b}
  return 'en';
}
let lang=pickLang();
const T=()=>UI[lang];
// texte d'une question dans la langue choisie, repli sur l'anglais
function tx(n){const i=n.i18n||{};const own=i[lang];return {...(i.en||{}),...(own||{}),fb:!own&&lang!=='en'}}

const sl=$('lang');
for(const [k,v] of Object.entries(LANGS)){const o=document.createElement('option');o.value=k;o.textContent=v;sl.append(o)}
sl.onchange=()=>{lang=sl.value;try{localStorage.setItem('ti-lang',lang)}catch(e){};applyLang()};

const chips={};
const fEl=$('filters');
for(const k of DKEYS){
  const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');b.style.setProperty('--c',`var(--d-${k})`);
  const i=document.createElement('i'),s=document.createElement('span');b.append(i,s);chips[k]=s;
  b.onclick=()=>{active.has(k)?active.delete(k):active.add(k);b.setAttribute('aria-pressed',active.has(k));draw()};
  fEl.append(b);
}
const qi=document.createElement('input');qi.id='q';qi.type='search';
qi.oninput=()=>{query=qi.value.trim().toLowerCase();draw()};fEl.append(qi);

function applyLang(){
  const t=T();sl.value=lang;
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.documentElement.classList.toggle('nonlatin',['zh','hi','ar'].includes(lang));
  $('sub').textContent=t.sub;$('foot').textContent=t.foot;qi.placeholder=t.search;cv.setAttribute('aria-label',t.map);
  for(const k of DKEYS)chips[k].textContent=t.dom[k];
  const lg=$('legend');lg.replaceChildren();t.near.forEach((s,i)=>{const sp=document.createElement('span'),b=document.createElement('b');if(i<2)b.className='d'+i;sp.append(b,s);lg.append(sp)});
  setStatus(statusKey);
  $('digT').textContent=t.dig;$('nlL').textContent=t.nl;$('nlBtn').textContent=t.nlBtn;$('nlLang').value=lang;$('pkL').textContent=t.kind;$('pk0').textContent=t.k0;$('pk1').textContent=t.k1;$('pk2').textContent=t.k2;
  $('newsT').textContent=t.news;$('propT').textContent=t.prop;$('pqL').textContent=t.propQ;$('psL').textContent=t.propS;$('peL').textContent=t.propE;$('pBtn').textContent=t.send;$('dataLink').textContent=t.data;
  renderNews();renderDigest();
  if(sel)select(sel);else panel.replaceChildren(el('p',{textContent:t.pick,style:'margin:0;color:var(--muted)'}));
  draw();
}
function setStatus(k){statusKey=k;statusEl.hidden=!k;if(k)statusEl.textContent=T()[k]}
function visible(n){if(!active.has(n.d))return false;if(!query)return true;const a=tx(n);return (a.t+' '+a.s).toLowerCase().includes(query)}

function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;if(nodes.length&&!view.done){fit();view.done=true}draw()}
addEventListener('resize',resize);

function layout(){
  const R=380,anchor={};DKEYS.forEach((k,i)=>{const a=i/DKEYS.length*Math.PI*2-Math.PI/2;anchor[k]={x:Math.cos(a)*R,y:Math.sin(a)*R}});
  nodes.forEach((n,i)=>{const a=anchor[n.d]||{x:0,y:0};n.x=a.x+Math.cos(i*2.4)*70;n.y=a.y+Math.sin(i*2.4)*70;n.vx=0;n.vy=0});
  for(let it=0;it<500;it++){
    const t=1-it/500;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);
      const f=4200/d2;dx/=d;dy/=d;a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;
    }
    for(const e of edges){const a=byId[e[0]],b=byId[e[1]];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;const f=(d-140)*0.01;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
    for(const n of nodes){const a=anchor[n.d]||{x:0,y:0};n.vx+=(a.x-n.x)*0.008;n.vy+=(a.y-n.y)*0.008;n.x+=n.vx*t;n.y+=n.vy*t;n.vx*=.55;n.vy*=.55}
  }
  fit();
}
function fit(){
  if(!nodes.length||!W)return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const n of nodes){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)}
  const pad=60;view.k=Math.min((W-pad*2)/(x1-x0||1),(H-pad*2)/(y1-y0||1),1.4);
  view.x=W/2-(x0+x1)/2*view.k;view.y=H/2-(y0+y1)/2*view.k;
}
const toS=n=>({x:n.x*view.k+view.x,y:n.y*view.k+view.y});

function draw(){
  if(!W)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const fg=css('--fg'),muted=css('--muted'),line=css('--line'),accent=css('--accent');
  const focus=sel||hover;const nb=new Set();if(focus){nb.add(focus.id);edges.forEach(e=>{if(e[0]===focus.id)nb.add(e[1]);if(e[1]===focus.id)nb.add(e[0])})}
  for(const e of edges){
    const a=byId[e[0]],b=byId[e[1]];if(!visible(a)||!visible(b))continue;
    const on=focus&&(e[0]===focus.id||e[1]===focus.id);
    const p=toS(a),q=toS(b);ctx.strokeStyle=on?accent:line;ctx.globalAlpha=focus&&!on?.3:1;ctx.lineWidth=on?1.6:1;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
  }
  let shown=0;const showAll=view.k>.75;
  for(const n of nodes){
    if(!visible(n))continue;shown++;
    const p=toS(n),c=css('--d-'+n.d),r=6+n.n*1.5,dim=focus&&!nb.has(n.id);
    ctx.globalAlpha=dim?.28:1;
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.setLineDash(n.n===0?[1.5,3]:n.n===1?[4,3]:[]);
    ctx.beginPath();ctx.arc(p.x,p.y,r+4.5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    if(n===sel){ctx.strokeStyle=fg;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r+9,0,Math.PI*2);ctx.stroke()}
    if(showAll||nb.has(n.id)||query){
      ctx.font=(n===focus?'600 ':'500 ')+'11.5px Inter, system-ui, "Noto Sans", sans-serif';ctx.fillStyle=n===focus?fg:muted;ctx.textAlign='center';
      ctx.fillText(tx(n).s||'',p.x,p.y+r+17);
    }
  }
  ctx.globalAlpha=1;
  $('count').textContent=nodes.length?T().count(shown,nodes.length):'—';
}

function pick(mx,my){let best=null,bd=20;for(const n of nodes){if(!visible(n))continue;const p=toS(n),d=Math.hypot(p.x-mx,p.y-my);if(d<bd){bd=d;best=n}}return best}
let start=null,moved=false;const pts=new Map();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});start={x:e.offsetX,y:e.offsetY};moved=false});
cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId)){
    const before=[...pts.values()].map(p=>({...p}));const prev=pts.get(e.pointerId);
    pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
    if(pts.size===2){const [a0,b0]=before,[a1,b1]=[...pts.values()];const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y),d1=Math.hypot(a1.x-b1.x,a1.y-b1.y);if(d0>0)zoom((a1.x+b1.x)/2,(a1.y+b1.y)/2,d1/d0);moved=true;return}
    if(Math.abs(e.offsetX-start.x)+Math.abs(e.offsetY-start.y)>4)moved=true;
    view.x+=e.offsetX-prev.x;view.y+=e.offsetY-prev.y;draw();return;
  }
  const h=pick(e.offsetX,e.offsetY);if(h!==hover){hover=h;cv.style.cursor=h?'pointer':'grab';draw()}
});
cv.addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(!moved){const n=pick(e.offsetX,e.offsetY);if(n)select(n)}});
cv.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
cv.addEventListener('pointerleave',()=>{if(hover){hover=null;draw()}});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.offsetX,e.offsetY,Math.exp(-e.deltaY*0.0015))},{passive:false});
function zoom(cx,cy,f){const k=Math.min(4,Math.max(.25,view.k*f));f=k/view.k;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=k;draw()}

function el(tag,props,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(props||{})){if(k==='style')e.style.cssText=v;else e[k]=v}kids.forEach(k=>k!=null&&e.append(k));return e}
function select(n){
  sel=n;draw();const t=T(),a=tx(n);panel.replaceChildren();
  const dom=el('div',{className:'dom',textContent:t.dom[n.d]||n.d});dom.style.setProperty('--c',`var(--d-${n.d})`);
  const near=el('span',{className:'near',textContent:t.near[n.n]||''});near.dataset.n=n.n;
  const h=el('h2',{textContent:a.t||''});if(a.fb)h.lang='en';
  panel.append(dom,h,near);
  if(a.fb)panel.append(el('p',{className:'fallback',textContent:t.fb}));
  for(const k of ['known','block','leads'])if(a[k]){const p=el('p',{textContent:a[k]});if(a.fb)p.lang='en';panel.append(el('section',null,el('h3',{textContent:t[k]}),p))}
  if(Array.isArray(n.sub)&&n.sub.length){const ul=el('ul',{className:'sublist'});n.sub.forEach(q=>{const s=q&&(q[lang]||q.en);if(s)ul.append(el('li',{textContent:s}))});if(ul.childElementCount)panel.append(el('section',null,el('h3',{textContent:t.subq}),ul))}

function ingest(docs){

  byId={};nodes.forEach(n=>{n.n=Math.max(0,Math.min(2,+n.n||0));byId[n.id]=n});
  const seen=new Set();edges=[];
  for(const n of nodes)for(const l of n.links||[]){if(!byId[l]||l===n.id)continue;const k=[n.id,l].sort().join('|');if(!seen.has(k)){seen.add(k);edges.push([n.id,l])}}
  layout();view.done=!!W;
  setStatus(nodes.length?null:'empty');
  const s=byId[prev]||byId['consciousness']||byId['conscience']||nodes[0];
  if(s)select(s);else applyLang();

s de départ deviennent très petites.","leads":"Méthodes probabilistes, preuves assistées par ordinateur.","s":"Conjecture de Collatz","t":"La suite de Collatz finit-elle toujours par 1 ?"},"hi":{"block":"हो सकता है गणित के पास उपकरण न हों; यह एक सरल नियम है जिसमें कोई ज्ञात संरचना नहीं जिसका लाभ उठाया जा सके।","known":"इसे विशाल संख्याओं के लिए जाँचा जा चुका है, और 2019 में टेरेंस ताओ ने दिखाया कि लगभग सभी आरंभिक मान बहुत छोटे हो जाते हैं।","leads":"प्रायिकतात्मक विधियाँ, कंप्यूटर-सहायता प्राप्त प्रमाण।","s":"कोलाट्ज़ अनुमान","t":"क्या कोलाट्ज़ अनुक्रम हमेशा 1 पर समाप्त होता है?"},"pt":{"block":"Talvez falte ferramenta à matemática; é uma regra simples sem estrutura conhecida a explorar.","known":"Ela foi verificada para números enormes, e em 2019 Terence Tao mostrou que quase todos os valores iniciais chegam a números bem pequenos.","leads":"Métodos probabilísticos, demonstrações assistidas por computador.","s":"Conjectura de Collatz","t":"A sequência de Collatz sempre termina em 1?"},"zh":{"block":"数学可能还缺少工具;它是一条简单的规则,没有已知的结构可供利用。","known":"它已对极大的数验证过,2019年陶哲轩证明,几乎所有起始值都会变得很小。","leads":"概率方法,计算机辅助证明。","s":"考拉兹猜想","t":"考拉兹数列总会以1结束吗?"}},"links":["maths-ia"],"n":0,"src":[{"t":"Mathematician proves huge result on 'dangerous' problem (Quanta, 2019)","ty":"press","u":"https://quantamagazine.org/mathematician-proves-huge-result-on-dangerous-problem-20191211"},{"t":"Tao, Almost all orbits of the Collatz map attain almost bounded values (arXiv)","ty":"preprint","u":"https://arxiv.org/abs/1909.03562v5"},{"t":"Almost all orbits of the Collatz map attain almost bounded values","ty":"study","u":"https://cambridge.org/core/services/aop-cambridge-core/content/view/1008CC2DF91AF87F66D190C5E01C907F/S2050508622000087a.pdf/almost-all-orbits-of-the-collatz-map-attain-almost-bounded-values.pdf"}],"sub":[{"ar":"هل يمكن ترقية نتيجة تاو «لكل الأعداد تقريبًا» من الكثافة اللوغاريتمية إلى الكثافة الطبيعية المعتادة؟","en":"Can Tao's 'almost all' result be upgraded from logarithmic density to ue de places disponibles, et des finances publiques en difficulté.","leads":"Grandes bases de données historiques comme Seshat, histoire quantitative.","s":"Effondrements","t":"Pourquoi les civilisations s'effondrent-elles ?"},"hi":{"block":"मामले कम हैं और हर एक अलग है, इसलिए सामान्य नियमों को परखना कठिन है।","known":"पिछले संकटों के अध्ययन व्यापक दरिद्रता, उपलब्ध स्थानों से ज़्यादा लोगों की अभिजात पदों के लिए होड़, और राज्य के वित्त पर दबाव जैसे दबावों की ओर इशारा करते हैं।","leads":"सेशैट जैसे बड़े ऐतिहासिक डेटाबेस, मात्रात्मक इतिहास।","s":"सभ्यताओं का पतन","t":"सभ्यताएँ क्यों ढह जाती हैं?"},"pt":{"block":"Há poucos casos, cada um diferente, então leis gerais são difíceis de testar.","known":"Estudos de crises passadas apontam pressões como o empobrecimento generalizado, mais pessoas disputando posições de elite do que há vagas, e finanças do Estado em dificuldade.","leads":"Grandes bases de dados históricos, como o Seshat, história quantitativa.","s":"Colapso de civilizações","t":"Por que as civilizações entram em colapso?"},"zh":{"block":"案例很少,而且各不相同,因此很难检验一般规律。","known":"对过去危机的研究指出了一些压力，例如普遍贫困化、争夺精英地位的人多于可用位置，以及国家财政紧张。","leads":"Seshat等大型历史数据库,定量历史学。","s":"文明崩溃","t":"文明为什么会崩溃?"}},"links":["cooperation","points-bascule"],"n":0,"src":[{"t":"Social complexity and collapse (Complexity Science Hub, Seshat)","ty":"institution","u":"https://csh.ac.at/research/research-topic/social-complexity-collapse/"},{"t":"All Crises are Unhappy in Their Own Way: The Role of Societal Instability in Shaping the Past","ty":"study","u":"https://www.cambridge.org/core/product/E1D2B51191D90217272192C2F7A173B4/core-reader"},{"t":"When Collapse Wasn't Inevitable: How Some Societies Turned Crisis into Renewal","ty":"institution","u":"https://csh.ac.at/news/when-collapse-wasnt-inevitable-how-some-societies-turned-crisis-into-renewal/"}],"sub":[{"ar":"لماذا تنتهي بعض الأزمات المجتمعية بالانهيار بينما تؤدي أزمات أخرى إلى الإصلاح والتجدد؟","en":"Why do some societal crises end in collapse while others lead to reform and renewal?","es":"¿Por qué algunas crisis sociales terminan en colapso mientras que otras conducen a reformas y renovación?","fr":"Pourquoi certaines crises de société se terminent-elles par un effondrement, alors que d'autres mènent à des réformes et à un renouveau ?","hi":"कुछ सामाजिक संकट पतन में क्यों ख़त्म होते हैं, जबकि दूसरे सुधार और नवीनीकरण की ओर ले जाते हैं?","pt":"Por que algumas crises sociais terminam em colapso enquanto outras levam a reformas e renovação?","zh":"为什么有些社会危机以崩溃告终，而另一些却带来了改革与复兴？"},{"ar":"لماذا لا تميل العواقب المختلفة لأزمة مجتمعية إلى الحدوث معًا؟","en":"Why do the different consequences of a societal crisis not tend to happen together?","es":"¿Por qué las distintas consecuencias de una crisis social no suelen darse juntas?","fr":"Pourquoi les différentes conséquences d'une crise de société n'ont-elles pas tendance à survenir ensemble ?","hi":"किसी सामाजिक संकट के अलग-अलग परिणाम आम तौर पर एक साथ क्यों नहीं होते?","pt":"Por que as diferentes consequências de uma crise social não costumam acontecer juntas?","zh":"为什么一场社会危机的各种后果往往不会同时出现？"}]},{"id":"energie-sombre","checked":"2026-11-18","d":"P","i18n":{"ar":{"block":"تتنبأ فيزياء الكم بقيمة أكبر بنحو 60 إلى 120 رتبة من حيث المقدار مما تسمح به الأرصاد. وهذه أزمة خطيرة في الفيزياء.","known":"القيمة التي تتنبأ بها الفيزياء الكمومية تخطئ بنحو 120 رتبة قدر، وهو أسوأ تباين في الفيزياء كلها.","leads":"تلمّح مسوح DESI إلى أنها قد تتغير مع الزمن؛ وسيقيسها تلسكوب إقليدس ومرصد روبن بدقة أكبر.","s":"الطاقة المظلمة","t":"ما الطاقة المظلمة؟"},"en":{"block":"Quantum physics predicts a value some 60 to 120 orders of magnitude larger than observations allow. This is a serious crisis in physics.","known":"The expansion of the universe is accelerating. The cause, called dark energy, makes up about 70% of its energy content.","leads":"DESI surveys hint that it may change over time; Euclid and the Rubin Observatory will measure it more precisely.","s":"Dark energy","t":"What is dark energy?"},"es":{"block":"La física cuántica predice un valor entre 60 y 120 órdenes de magnitud mayor de lo que permiten las observaciones. Es una crisis seria para la física.","known":"La expansión del universo se está acelerando. La causa, llamada energía oscura, constituye cerca del 70 % de su contenido energético.","leads":"Los estudios de DESI sugieren que podría cambiar con el tiempo; Euclid y el Observatorio Rubin la medirán con más precisión.","s":"Energía oscura","t":"¿Qué es la energía oscura?"},"fr":{"block":"La physique quantique prédit une valeur de 60 à 120 ordres de grandeur plus grande que ce que permettent les observations. C'est une crise sérieuse pour la physique.","known":"L'expansion de l'univers accélère. La cause, appelée énergie sombre, représente environ 70 % de son contenu énergétique.","leads":"Les relevés DESI suggèrent qu'elle pourrait varier dans le temps ; Euclid et l'observatoire Rubin la mesureront plus précisément.","s":"Énergie sombre","t":"Qu'est-ce que l'énergie sombre ?"},"hi":{"block":"क्वांटम भौतिकी जो मान बताती है, वह प्रेक्षणों द्वारा अनुमत मान से 60 से 120 परिमाण-कोटि (ऑर्डर ऑफ़ मैग्निट्यूड) अधिक है। यह भौतिकी के लिए एक गंभीर संकट है।","known":"क्वांटम भौतिकी द्वारा अनुमानित मान लगभग 120 कोटि परिमाण (ऑर्डर ऑफ मैग्नीट्यूड) गलत है, जो पूरी भौतिकी का सबसे बड़ा बेमेल है।","leads":"DESI सर्वेक्षण संकेत देते हैं कि यह समय के साथ बदल सकती है; Euclid और रुबिन वेधशाला इसे और अधिक सटीकता से मापेंगे।","s":"डार्क एनर्जी","t":"डार्क एनर्जी क्या है?"},"pt":{"block":"A física quântica prevê um valor de 60 a 120 ordens de grandeza maior do que as observações permitem. É uma crise séria para a física.","known":"A expansão do universo está se acelerando. A causa, chamada energia escura, responde por cerca de 70% do seu conteúdo energético.","leads":"Os levantamentos do DESI sugerem que ela pode mudar com o tempo; o Euclid e o Observatório Rubin vão medi-la com mais precisão.","s":"Energia escura","t":"O que é a energia escura?"},"zh":{"block" a de Langlands é verdadeiro?"},"zh":{"block":"与素数最接近的算术版本在很大程度上仍未解决。","known":"这是一张庞大的猜想网络,把数论、几何和对称性联系在一起。几何版本已于2024年被证明。","leads":"把几何版本证明中的方法推广出去。","s":"朗兰兹纲领","t":"朗兰兹纲领成立吗?"}},"links":["riemann","maths-ia","birch-swinnerton-dyer"],"n":1,"src":[{"t":"Gaitsgory and Raskin, Proof of the geometric Langlands conjecture I: construction of the functor (arXiv, 2024; first of a series of papers)","ty":"preprint","u":"https://arxiv.org/abs/2405.03599"},{"t":"Monumental proof settles geometric Langlands conjecture (Quanta, 2024)","ty":"press","u":"https://www.quantamagazine.org/monumental-proof-settles-geometric-langlands-conjecture-20240719/"},{"t":"Langlands Program, trace formulas, and their geometrization","ty":"reference","u":"https://www.ams.org/journals/bull/2013-50-01/S0273-0979-2012-01387-3"}],"sub":[{"ar":"هل يمكن برهان مبدأ الدالّية (functoriality) للانغلاندز بصورة عامة؟","en":"Can Langlands's principle of functoriality be proved in general?","es":"¿Se puede demostrar en general el principio de functorialidad de Langlands?","fr":"Le principe de fonctorialité de Langlands peut-il être démontré en général ?","hi":"क्या लैंगलैंड्स के फ़ंक्टोरियलिटी सिद्धांत को सामान्य रूप में सिद्ध किया जा सकता है?","pt":"O princípio de functorialidade de Langlands pode ser provado em geral?","zh":"朗兰兹的函子性原理能否被普遍证明？"},{"ar":"هل يمكن استخدام صيغ الأثر لبرهان الدالّية، كما يقترح فرنكل ولانغلاندز ونغو؟","en":"Can trace formulas be used to prove functoriality, as Frenkel, Langlands and Ngô propose?","es":"¿Pueden usarse las fórmulas de trazas para demostrar la functorialidad, como proponen Frenkel, Langlands y Ngô?","fr":"Les formules des traces peuvent-elles servir à démontrer la fonctorialité, comme le proposent Frenkel, Langlands et Ngô ?","hi":"क्या फ़्रेंकेल, लैंगलैंड्स और न्गो के प्रस्ताव के अनुसार ट्रेस सूत्रों से फ़ंक्टोरियलिटी सिद्ध की जा सकती है?","pt":"As fórmulas do traço podem ser usadas para provar a functorialidade, como propõem Frenkel, Langlands e Ngô?","zh":"能否像弗伦克尔、 ement une activité cérébrale de fond aléatoire ?","hi":"किसी हरकत से पहले दर्ज होने वाला मस्तिष्क संकेत ('रेडीनेस पोटेंशियल') किसी निर्णय को दर्शाता है, या बस मस्तिष्क की बेतरतीब पृष्ठभूमि गतिविधि को?","pt":"O sinal cerebral registrado antes de um movimento (o «potencial de prontidão») reflete uma decisão, ou apenas atividade cerebral de fundo aleatória?","zh":"在动作之前记录到的脑信号（“准备电位”）反映的是一个决定，还是只是随机的背景脑活动？"},{"ar":"هل تشير هذه الإشارة إلى بدء فعل ما، أم إلى شيء أعمّ مثل التوقع أو الانتباه؟","en":"Does this signal mark the start of an action, or something more general such as expecting or paying attention?","es":"¿Marca esta señal el inicio de una acción, o algo más general como la anticipación o la atención?","fr":"Ce signal marque-t-il le début d'une action, ou quelque chose de plus général comme l'anticipation ou l'attention ?","hi":"क्या यह संकेत किसी क्रिया की शुरुआत दिखाता है, या कुछ अधिक सामान्य, जैसे अपेक्षा या ध्यान देना?","pt":"Esse sinal marca o início de uma ação, ou algo mais geral como a expectativa ou a atenção?","zh":"这个信号标志着动作的开始，还是更一般的东西，比如预期或注意？"},{"ar":"لماذا لا يُظهر بعض الناس أي جهد استعداد على الإطلاق؟","en":"Why do some people show no readiness potential at all?","es":"¿Por qué algunas personas no muestran ningún potencial de preparación?","fr":"Pourquoi certaines personnes ne présentent-elles aucun potentiel de préparation motrice ?","hi":"कुछ लोगों में रेडीनेस पोटेंशियल बिल्कुल क्यों नहीं दिखता?","pt":"Por que algumas pessoas não mostram nenhum potencial de prontidão?","zh":"为什么有些人根本没有出现准备电位？"}]},{"id":"maths-ia","checked":"2026-11-18","d":"M","i18n":{"ar":{"block":"يحتاج البحث إلى مفاهيم جديدة، لا مجرد حل مسائل طرحها غيرك.","known":"في عام 2025، بلغت أنظمة الذكاء الاصطناعي مستوى الميدالية الذهبية في الأولمبياد الدولي للرياضيات.","leads":"البراهين الصورية في مساعد البراهين Lean، والتعاون بين الرياضيين والذكاء الاصطناعي.","s":"رياضيات الذكاء الاصطناعي","t":"هل يستطيع الذكاء الاصطناعي اكتشاف نتائج رياضية كبرى بمفرده؟"},"en":{"block":"Research nee or novas conjecturas e conceitos, e não apenas resolver problemas escritos por humanos?","zh":"人工智能能否提出新的猜想和概念，而不仅仅是解决人类写好的问题？"},{"ar":"كيف يتعلم الذكاء الاصطناعي الرياضيات الصورية مع قلة البراهين الصورية التي كتبها البشر للتدرّب عليها؟","en":"How can AI learn formal mathematics when so few human-written formal proofs exist to train on?","es":"¿Cómo puede la IA aprender matemáticas formales cuando existen tan pocas demostraciones formales escritas por humanos para entrenarse?","fr":"Comment l'IA peut-elle apprendre les mathématiques formelles alors qu'il existe si peu de preuves formelles écrites par des humains pour s'entraîner ?","hi":"जब प्रशिक्षण के लिए मनुष्यों द्वारा लिखे गए औपचारिक प्रमाण इतने कम हैं, तो एआई औपचारिक गणित कैसे सीख सकता है?","pt":"Como a IA pode aprender matemática formal quando existem tão poucas provas formais escritas por humanos para treinar?","zh":"人类编写的形式化证明如此稀少，人工智能该如何学习形式化数学？"}]},{"id":"matiere-antimatiere","checked":"2026-11-18","d":"P","i18n":{"ar":{"block":"اللاتناظرات المعروفة بينهما أضعف بكثير من أن تفسّر وجودنا.","known":"كان ينبغي أن ينتج الانفجار العظيم كميات متساوية من المادة والمادة المضادة، فتفني إحداهما الأخرى.","leads":"تذبذبات النيوترينو (DUNE وهايبر-كاميوكاندي) وقياسات العزم ثنائي القطب الكهربائي.","s":"المادة والمادة المضادة","t":"لماذا توجد مادة أكثر من المادة المضادة؟"},"en":{"block":"The known asymmetries between them are far too weak to explain our existence.","known":"The Big Bang should have produced equal amounts of matter and antimatter, which would have annihilated.","leads":"Neutrino oscillations (DUNE, Hyper-Kamiokande) and measurements of the electric dipole moment.","s":"Matter vs antimatter","t":"Why is there more matter than antimatter?"},"es":{"block":"Las asimetrías conocidas entre ellas son demasiado débiles para explicar nuestra existencia.","known":"El Big Bang debería haber producido cantidades iguales de materia y antimateria, que se habrían aniquilado.","leads":"Oscilaciones de neutrinos (DUNE, Hyper-Kamiokande) y mediciones del momento dipolar eléctrico.","s":"Materia y antimateria","t":"¿Por qué hay más materia que antimateria?"},"fr":{"block":"Les asymétries connues entre les deux sont bien trop faibles pour expliquer notre existence.","known":"Le Big Bang aurait dû produire autant de matière que d'antimatière, qui se seraient annihilées.","leads":"Les oscillations des neutrinos (DUNE, Hyper-Kamiokande) et la mesure du moment dipolaire électrique.","s":"Matière et antimatière","t":"Pourquoi y a-t-il plus de matière que d'antimatière ?"},"hi":{"block":"उनके बीच की ज्ञात विषमताएँ हमारे अस्तित्व को समझाने के लिए बहुत कमज़ोर हैं।","known":"बिग बैंग को पदार्थ और प्रति-पदार्थ बराबर मात्रा में बनाना चाहिए था, जो एक-दूसरे को नष्ट कर देते।","leads":"न्यूट्रिनो दोलन (DUNE, हाइपर-कामियोकांडे) और विद्युत द्विध्रुव आघूर्ण के मापन।","s":"पदार्थ बनाम प्रति-पदार्थ","t":"प्रति-पदार्थ से अधिक पदार्थ क्यों है?"},"pt":{"block":"As assimetrias conhecidas entre elas são fracas demais para explicar a nossa existência.","known":"O Big Bang deveria ter produzido quantidades iguais de matéria e antimatéria, que teriam se aniquilado.","leads":"Oscilações de neutrinos (DUNE, Hyper-Kamiokande) e medições do momento de dipolo elétrico.","s":"Matéria e antimatéria","t":"Por que há mais matéria do que antimatéria?"},"zh":{"block":"已知的两者之间的不对称性太弱,远不足以解释我们的存在。","known":"大爆炸本应产生等量的物质和反物质,它们会彼此湮灭。","leads":"中微子振荡(DUNE、Hyper-Kamiokande)以及电偶极矩的测量。","s":"物质与反物质","t":"为什么物质比反物质多?"}},"links":["neutrinos-masse","origine-univers"],"n":1,"src":[{"t":"Optimisation of the Search for CP-symmetry Violation at the Deep Underground Neutrino Experiment","ty":"institution","u":"https://www.osti.gov/biblio/1998949"},{"t":"Constraint on the matter–antimatter symmetry-violating phase in neutrino oscillations","ty":"study","u":"https://eprints.whiterose.ac.uk/160770"}],"sub":[{"ar":"هل تتذبذب النيوترينوات ومضادات النيوترينوات بشكل مختلف، مما يعني انتهاكًا لتناظر CP بين اللبتونات؟","en":"Do neutrinos and antineutrinos oscillate differently, which would mean CP violation among leptons?","es":"¿Oscilan de forma distinta los neutrinos y los antineutrinos, lo que significaría violación de CP en los leptones?","fr":"Les neutrinos et les antineutrinos oscillent-ils différemment, ce qui signifierait une violation de CP chez les leptons ?","hi":"क्या न्यूट्रिनो और एंटीन्यूट्रिनो अलग-अलग तरह से दोलन करते हैं, जिसका अर्थ होगा लेप्टॉनों में CP उल्लंघन?","pt":"Os neutrinos e os antineutrinos oscilam de forma diferente, o que significaria violação de CP entre os léptons?","zh":"中微子和反中微子的振荡方式是否不同？这将意味着轻子中存在CP破坏。"},{"ar":"هل يمكن أن يكون انتهاك CP بين اللبتونات قد أنتج فائض المادة، عبر عملية تُسمّى التكوين اللبتوني (leptogenesis)؟","en":"Could CP violation among leptons have created the excess of matter, through a process called leptogenesis?","es":"¿Pudo la violación de CP en los leptones crear el exceso de materia, mediante un proceso llamado leptogénesis?","fr":"La violation de CP chez les leptons a-t-elle pu créer l'excès de matière, par un processus appelé leptogenèse ?","hi":"क्या लेप्टॉनों में CP उल्लंघन ने ‘लेप्टोजेनेसिस’ नामक प्रक्रिया द्वारा पदार्थ की अधिकता पैदा की हो सकती है?","pt":"A violação de CP entre os léptons pode ter criado o excesso de matéria, por meio de um processo chamado leptogênese?","zh":"轻子中的CP破坏是否可能通过一种称为“轻子生成”的过程造成了物质的过剩？"}]},{"id":"matiere-noire","checked":"2026-11-18","d":"P","i18n":{"ar":{"block":"لم تؤكد عقود من تجارب الرصد المباشر أي شيء؛ وفي عام 2026 أعلنت تجربة LZ عن حدث مرشح واحد، أدنى بكثير من عتبة الاكتشاف.","known":"نحو 85% من المادة في الكون غير مرئية. ولا نرصدها إلا عبر جاذبيتها المؤثرة في المجرات والضوء.","leads":"جسيمات ضخمة (WIMPs)، والأكسيونات، وكواشف الجيل التالي تحت الأرض، أو تعديل الجاذبية.","s":"المادة المظلمة","t":"ما المادة المظلمة؟"},"en":{"block":"Decades of direct-detection experiments have confirmed nothing; in 2026 LZ reported one candidate event, far below the threshold for a discovery.","known":"About 85% of the matter in the u s, detectores subterrâneos de nova geração, ou uma modificação da gravidade.","s":"Matéria escura","t":"O que é a matéria escura?"},"zh":{"block":"数十年的直接探测实验没有确认任何结果;2026年,LZ实验报告了一个候选事件,但远未达到发现的标准。","known":"宇宙中约85%的物质是看不见的。我们只能通过它对星系和光的引力作用探测到它。","leads":"大质量粒子(WIMP)、轴子、下一代地下探测器,或者对引力的修正。","s":"暗物质","t":"暗物质是什么?"}},"links":["energie-sombre","gravite-quantique","neutrinos-masse"],"n":1,"src":[{"t":"LZ experiment sees surprising result in search for dark matter (2026)","ty":"institution","u":"https://www.bnl.gov/newsroom/news.php?a=123133"},{"t":"LZ experiment sets new record in search for dark matter","ty":"institution","u":"https://ucdavis.edu/news/lz-experiment-sets-new-record-search-dark-matter"},{"t":"A new era in the search for dark matter","ty":"reference","u":"https://ideas.repec.org/a/nat/nature/v562y2018i7725d10.1038_s41586-018-0542-z.html"}],"sub":[{"ar":"إذا كانت المادة المظلمة مكوّنة من جسيمات WIMP، فهل يمكن أن تكون أخف أو أن تعطي إشارات أضعف مما تتنبأ به أبسط النماذج؟","en":"If dark matter is made of WIMPs, could they be lighter or give weaker signals than the simplest models predict?","es":"Si la materia oscura está hecha de WIMP, ¿podrían ser más ligeras o dar señales más débiles de lo que predicen los modelos más simples?","fr":"Si la matière noire est faite de WIMP, pourraient-elles être plus légères ou donner des signaux plus faibles que ne le prévoient les modèles les plus simples ?","hi":"यदि डार्क मैटर WIMP कणों से बना है, तो क्या वे सबसे सरल मॉडलों के अनुमान से हल्के हो सकते हैं या कमज़ोर संकेत दे सकते हैं?","pt":"Se a matéria escura for feita de WIMPs, elas poderiam ser mais leves ou dar sinais mais fracos do que preveem os modelos mais simples?","zh":"如果暗物质由WIMP构成，它们是否可能比最简单模型预测的更轻，或信号更弱？"},{"ar":"هل تشير ألغاز المجرات الصغيرة (مثل مشكلة القمة واللب والتوابع المفقودة) إلى مادة مظلمة تتفاعل مع نفسها، أم إلى أخطاء في المحاكاة؟","en":"Do puzzles in small galaxies (such as cusp-core and missing satellites) point to dark matter that interacts with िकी के विपरीत है।","leads":"स्केलिंग नियम, अनंत-चौड़ाई सीमाएँ, सीखने की गतिकी के अध्ययन।","s":"डीप लर्निंग सिद्धांत","t":"गहरे न्यूरल नेटवर्क इतना अच्छा सामान्यीकरण क्यों करते हैं?"},"pt":{"block":"Não há uma teoria completa que explique por quê, nem que preveja quando isso falha.","known":"Redes enormes treinadas com dados finitos ainda funcionam em exemplos novos, ao contrário do que diz a estatística clássica.","leads":"Leis de escala, limites de largura infinita, estudos da dinâmica de aprendizado.","s":"Teoria do aprendizado profundo","t":"Por que as redes neurais profundas generalizam tão bem?"},"zh":{"block":"目前没有完整的理论来解释其原因,也无法预测它何时会失效。","known":"用有限数据训练的巨型网络仍然能处理新样本,这与经典统计学相悖。","leads":"缩放定律,无限宽度极限,学习动力学研究。","s":"深度学习理论","t":"为什么深度神经网络的泛化能力这么强?"}},"links":["interpretabilite","ia-generale"],"n":1,"src":[{"t":"On the generalization mystery in deep learning (arXiv)","ty":"preprint","u":"https://arxiv.org/pdf/2203.10036"},{"t":"Understanding deep learning requires rethinking generalization","ty":"study","u":"https://research.google/pubs/understanding-deep-learning-requires-rethinking-generalization/"}],"sub":[{"ar":"لماذا تظل الشبكات القادرة على حفظ بيانات موسومة عشوائيًا تُعمِّم جيدًا على البيانات الحقيقية؟","en":"Why do networks that can memorize randomly labelled data still generalize well on real data?","es":"¿Por qué las redes capaces de memorizar datos etiquetados al azar siguen generalizando bien con datos reales?","fr":"Pourquoi des réseaux capables de mémoriser des données étiquetées au hasard généralisent-ils quand même bien sur des données réelles ?","hi":"जो नेटवर्क यादृच्छिक रूप से लेबल किए गए डेटा को याद कर सकते हैं, वे वास्तविक डेटा पर फिर भी अच्छा सामान्यीकरण क्यों करते हैं?","pt":"Por que redes capazes de memorizar dados rotulados ao acaso ainda generalizam bem em dados reais?","zh":"能够记住随机标注数据的网络，为什么在真实数据上仍然泛化得很好？"},{"ar":"من بين كل الحلول الملائمة لبيانات التدريب، كيف يجد الانحدار التدرجي حلًا يُعمِّم جيدًا؟","en":"Among all the solutions that fit the training data, how does gradient descent find one that generalizes well?","es":"Entre todas las soluciones que se ajustan a los datos de entrenamiento, ¿cómo encuentra el descenso de gradiente una que generalice bien?","fr":"Parmi toutes les solutions qui collent aux données d'entraînement, comment la descente de gradient en trouve-t-elle une qui généralise bien ?","hi":"प्रशिक्षण डेटा में फ़िट होने वाले सभी हलों में से, ग्रेडिएंट डिसेंट ऐसा हल कैसे खोजता है जो अच्छा सामान्यीकरण करे?","pt":"Entre todas as soluções que se ajustam aos dados de treino, como o gradiente descendente encontra uma que generaliza bem?","zh":"在所有拟合训练数据的解中，梯度下降是如何找到一个泛化良好的解的？"},{"ar":"هل يمكننا تصميم مقياس أفضل لمدى «توافق» أمثلة التدريب فيما بينها (تماسك التدرجات) يأخذ بنية الشبكة في الحسبان؟","en":"Can we design a better measure of how much training examples 'agree' with each other (gradient coherence) that takes the network's structure into account?","es":"¿Podemos diseñar una mejor medida de cuánto «concuerdan» entre sí los ejemplos de entrenamiento (coherencia de gradientes) que tenga en cuenta la estructura de la red?","fr":"Peut-on concevoir une meilleure mesure de l'« accord » entre exemples d'entraînement (cohérence des gradients) qui tienne compte de la structure du réseau ?","hi":"क्या हम एक बेहतर माप बना सकते हैं जो बताए कि प्रशिक्षण उदाहरण आपस में कितने ‘सहमत’ हैं (ग्रेडिएंट सुसंगतता), और जो नेटवर्क की संरचना को भी ध्यान में रखे?","pt":"Podemos criar uma medida melhor de quanto os exemplos de treino «concordam» entre si (coerência dos gradientes) que leve em conta a estrutura da rede?","zh":"能否设计一种更好的度量，衡量训练样本之间的“一致”程度（梯度相干性），并把网络结构考虑在内？"}]},{"id":"trous-noirs-info","checked":"2026-11-18","d":"P","i18n":{"ar":{"block":"إذا اختفت المعلومات معها، يُنتهك قانون أساسي في الفيزياء الكمومية.","known":"أظهر هوكينغ أن الثقوب السوداء تتبخر ببطء بإطلاق الإشعاع.","leads":"\"الجزر\" ومنحنى بيج، والهولوغرافيا، وفكرة أن التشابك وهندسة الفضاء مترابطان.","s":"مفارقة المعلومات","t":"ماذا يحدث للمعلومات التي تسقط في ثقب أسود؟"},"en":{"block":"If information vanishes with them, a fundamental law of quantum physics is broken.","known":"Hawking showed that black holes slowly evaporate by emitting radiation.","leads":"\"Islands\" and the Page curve, holography, the idea that entanglement and the geometry of space are linked.","s":"Information paradox","t":"What happens to information that falls into a black hole?"},"es":{"block":"Si la información desaparece con ellos, se viola una ley fundamental de la física cuántica.","known":"Hawking demostró que los agujeros negros se evaporan lentamente al emitir radiación.","leads":"Las «islas» y la curva de Page, la holografía, la idea de que el entrelazamiento y la geometría del espacio están vinculados.","s":"Paradoja de la información","t":"¿Qué ocurre con la información que cae en un agujero negro?"},"fr":{"block":"Si l'information disparaît avec eux, une loi fondamentale de la physique quantique est violée.","known":"Hawking a montré que les trous noirs s'évaporent lentement en rayonnant.","leads":"Les « îlots » et la courbe de Page, l'holographie, l'idée qu'intrication et géométrie de l'espace sont liées.","s":"Paradoxe de l'information","t":"Que devient l'information qui tombe dans un trou noir ?"},"hi":{"block":"यदि जानकारी उनके साथ गायब हो जाती है, तो क्वांटम भौतिकी का एक मूलभूत नियम टूट जाता है।","known":"हॉकिंग ने दिखाया कि ब्लैक होल विकिरण उत्सर्जित करके धीरे-धीरे वाष्पित हो जाते हैं।","leads":"\"द्वीप\" और पेज वक्र, होलोग्राफी, यह विचार कि उलझाव और अंतरिक्ष की ज्यामिति आपस में जुड़े हैं।","s":"सूचना विरोधाभास","t":"ब्लैक होल में गिरने वाली जानकारी का क्या होता है?"},"pt":{"block":"Se a informação desaparece com eles, uma lei fundamental da física quântica é violada.","known":"Hawking mostrou que os buracos negros evaporam lentamente ao emitir radiação.","leads":"As \"ilhas\" e a curva de Page, a holografia, a ideia de que o emaranhamento e a geometria do espaço estão ligados.","s":"Paradoxo da infor لة يانغ–ميلز","t":"هل لنظرية يانغ–ميلز فجوة كتلة؟"},"en":{"block":"No one has given it a rigorous mathematical foundation.","known":"Physicists use this theory of the strong force with great success, and experiments confirm it.","leads":"Lattice computations, constructive quantum field theory.","s":"Yang–Mills mass gap","t":"Does Yang–Mills theory have a mass gap?"},"es":{"block":"Nadie le ha dado una base matemática rigurosa.","known":"Los físicos usan con gran éxito esta teoría de la fuerza fuerte, y los experimentos la confirman.","leads":"Cálculos en red, teoría cuántica de campos constructiva.","s":"Salto de masa de Yang–Mills","t":"¿Tiene la teoría de Yang–Mills un salto de masa?"},"fr":{"block":"Personne n'a pu lui donner un fondement mathématique rigoureux.","known":"Les physiciens utilisent cette théorie de l'interaction forte avec grand succès, et les expériences la confirment.","leads":"Calculs sur réseau, théorie quantique des champs constructive.","s":"Yang-Mills","t":"La théorie de Yang-Mills possède-t-elle un « trou de masse » ?"},"hi":{"block":"किसी ने इसे कठोर गणितीय आधार नहीं दिया है।","known":"भौतिक विज्ञानी प्रबल बल के इस सिद्धांत का बड़ी सफलता से उपयोग करते हैं, और प्रयोग इसकी पुष्टि करते हैं।","leads":"लैटिस गणनाएँ, रचनात्मक क्वांटम क्षेत्र सिद्धांत।","s":"यांग-मिल्स मास गैप","t":"क्या यांग-मिल्स सिद्धांत में मास गैप है?"},"pt":{"block":"Ninguém lhe deu uma base matemática rigorosa.","known":"Os físicos usam essa teoria da força forte com grande sucesso, e os experimentos a confirmam.","leads":"Cálculos em rede, teoria quântica de campos construtiva.","s":"Lacuna de massa de Yang–Mills","t":"A teoria de Yang–Mills tem uma lacuna de massa?"},"zh":{"block":"还没有人为它建立严格的数学基础。","known":"物理学家非常成功地运用这一强力理论,实验也证实了它。","leads":"格点计算,构造性量子场论。","s":"杨-米尔斯质量间隙","t":"杨-米尔斯理论存在质量间隙吗?"}},"links":["gravite-quantique","navier-stokes"],"n":0,"src":[{"t":"The Millennium Prize Problems (Clay Mathematics Institute)","ty":"reference","u":"https://www.claymath.org/millennium-problems"}],"sub":[{"ar":"هل يمكن بناء نظرية يانغ–ميلز الكمومية بصرامة في زمكان رباعي الأبعاد؟ لا يوجد حتى الآن أي مثال كامل لنظرية معيارية كمومية.","en":"Can quantum Yang–Mills theory be built rigorously in four-dimensional spacetime? No complete example of a quantum gauge theory exists yet.","es":"¿Se puede construir rigurosamente la teoría cuántica de Yang–Mills en un espacio-tiempo de cuatro dimensiones? Aún no existe ningún ejemplo completo de teoría gauge cuántica.","fr":"Peut-on construire rigoureusement la théorie quantique de Yang–Mills dans un espace-temps à quatre dimensions ? Il n'existe encore aucun exemple complet de théorie de jauge quantique.","hi":"क्या क्वांटम यांग–मिल्स सिद्धांत को चार-आयामी दिक्-काल में कठोर गणितीय रूप से बनाया जा सकता है? अभी तक क्वांटम गेज सिद्धांत का कोई पूर्ण उदाहरण नहीं है।","pt":"É possível construir rigorosamente a teoria quântica de Yang–Mills num espaço-tempo de quatro dimensões? Ainda não existe nenhum exemplo completo de teoria de gauge quântica.","zh":"量子杨–米尔斯理论能否在四维时空中被严格构造？目前还没有任何完整的量子规范理论实例。"},{"ar":"لماذا الكواركات محصورة، بحيث لا تُرى أبدًا منفردة؟","en":"Why are quarks confined, so that they are never seen on their own?","es":"¿Por qué están confinados los quarks, de modo que nunca se observan solos?","fr":"Pourquoi les quarks sont-ils confinés, si bien qu'on ne les observe jamais seuls ?","hi":"क्वार्क परिरुद्ध (कन्फ़ाइंड) क्यों हैं, जिससे वे कभी अकेले दिखाई नहीं देते?","pt":"Por que os quarks estão confinados, de modo que nunca são vistos sozinhos?","zh":"为什么夸克被禁闭，以至于从未被单独观测到？"},{"ar":"هل للنسخة الشبكية من النظرية نهاية سليمة عندما تتقلص المسافة بين نقاط الشبكة إلى الصفر (نهاية الاتصال)؟","en":"Does the lattice version of the theory have a proper limit when the lattice spacing shrinks to zero (the continuum limit)?","es":"¿Tiene la versión en red de la teoría un límite adecuado cuando el espaciado de la red se reduce a cero (el límite continuo)?","fr":"La version sur réseau de la théorie a-t-elle une v
