name: Validate and build

on:
  push:
    branches: [main]
    paths: ['data/**', 'page/**', 'tools/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data
        run: python3 tools/validate.py
      - name: Build site
        run: python3 tools/build_site.py page/index.html data/questions data/changes site data/digests
      - name: Commit rebuilt site
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "terra-incognita-bot"
            git config user.email "actions@github.com"
            git add site
            git commit -m "Rebuild site from data"
            git push
          fi
